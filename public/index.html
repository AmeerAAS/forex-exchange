<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Forex Currency Converter</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .converter-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
        }
        h2 {
            margin-top: 0;
            color: #111827;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #374151;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .currency-row {
            display: flex;
            gap: 12px;
        }
        .currency-row div {
            flex: 1;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0066cc;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0052a3;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 6px;
            text-align: center;
        }
        .result-amount {
            font-size: 22px;
            font-weight: bold;
            color: #166534;
        }
        .exchange-rate {
            font-size: 13px;
            color: #4b5563;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="converter-card">
    <h2>Currency Converter</h2>
    
    <div class="form-group">
        <label for="amount">Amount:</label>
        <input type="number" id="amount" value="100" min="0" step="any">
    </div>

    <div class="form-group currency-row">
        <div>
            <label for="from">From:</label>
            <select id="from">
                <option value="USD">USD - US Dollar</option>
                <option value="MYR">MYR - Malaysian Ringgit</option>
                <option value="EUR">EUR - Euro</option>
                <option value="GBP">GBP - British Pound</option>
                <option value="SGD">SGD - Singapore Dollar</option>
                <option value="JPY">JPY - Japanese Yen</option>
                <option value="AUD">AUD - Australian Dollar</option>
		<option value="CNY">AUD - Australian Dollar</option>
		<option value="IDR">IDR - Indonesian Rupiah</option>
		<option value="CAD">CAD - Canada Dollar</option>
		<option value="INR">INR - Indian Rupee</option>
		<option value="KRW">KRW - South Korean Won</option>
		<option value="KWD">KWD - Kuwait Dinar</option>
		<option value="BND">BND - Brunei Dollar</option>
		<option value="PHP">PHP - Philippine Peso</option>
		<option value="THB">THB - Thai Bath</option>
		<option value="KHR">KHR - Cambodia Khmer</option>
		<option value="MMK">MMK - Myanmar Kyat</option>
		<option value="VND">VND - Vietnamese Dong</option>
		<option value="PGK">PGK - Papua New Guinean kina</option>
            </select>
        </div>
        <div>
            <label for="to">To:</label>
            <select id="to">
                <option value="USD">USD - US Dollar</option>
                <option value="MYR">MYR - Malaysian Ringgit</option>
                <option value="EUR">EUR - Euro</option>
                <option value="GBP">GBP - British Pound</option>
                <option value="SGD">SGD - Singapore Dollar</option>
                <option value="JPY">JPY - Japanese Yen</option>
                <option value="AUD">AUD - Australian Dollar</option>
		<option value="CNY">AUD - Australian Dollar</option>
		<option value="IDR">IDR - Indonesian Rupiah</option>
		<option value="CAD">CAD - Canada Dollar</option>
		<option value="INR">INR - Indian Rupee</option>
		<option value="KRW">KRW - South Korean Won</option>
		<option value="KWD">KWD - Kuwait Dinar</option>
		<option value="BND">BND - Brunei Dollar</option>
		<option value="PHP">PHP - Philippine Peso</option>
		<option value="THB">THB - Thai Bath</option>
		<option value="KHR">KHR - Cambodia Khmer</option>
		<option value="MMK">MMK - Myanmar Kyat</option>
		<option value="VND">VND - Vietnamese Dong</option>
		<option value="PGK">PGK - Papua New Guinean kina</option>
            </select>
        </div>
    </div>

    <button onclick="convertCurrency()">Convert</button>

    <div class="result-box" id="result-box" style="display: none;">
        <div class="result-amount" id="result-amount">0.00</div>
        <div class="exchange-rate" id="exchange-rate">1 FROM = 1 TO</div>
    </div>
</div>

<script>
    async function convertCurrency() {
        const amount = document.getElementById('amount').value;
        const from = document.getElementById('from').value;
        const to = document.getElementById('to').value;

        if (!amount || amount <= 0) {
            alert("Please enter a valid amount.");
            return;
        }

        try {
            const response = await fetch(`/api/convert?from=${from}&to=${to}&amount=${amount}`);
            const data = await response.json();

            if (data.error) {
                alert(data.error);
                return;
            }

            document.getElementById('result-amount').innerText = `${data.convertedAmount.toLocaleString()} ${data.to}`;
            document.getElementById('exchange-rate').innerText = `1 ${data.from} = ${data.rate} ${data.to}`;
            document.getElementById('result-box').style.display = 'block';
        } catch (error) {
            console.error('Error converting currency:', error);
            alert('Failed to connect to currency backend server.');
        }
    }

    // Trigger initial conversion on load
    window.onload = convertCurrency;
</script>

</body>
</html>
